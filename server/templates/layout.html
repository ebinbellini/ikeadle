<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="/icons/favicon.ico" sizes="32x32">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/icons/manifest.json">
    <meta name="theme-color" content="#0058a3">
    <meta name="description" content="IKEAdle - gissa priset på varor ur IKEA-sortimentet.">
    <title>{{.Title}}</title>
    <script src="/navbar.js" defer></script>
    {{block "head" .}}{{end}}
</head>
<body>
    {{template "navbar" .}}

    {{block "content" .}}{{end}}

    <footer class="site-footer">
        <p>Ett inofficiellt fanspel. IKEA® är ett varumärke som tillhör Inter IKEA Systems B.V.</p>
    </footer>

    {{block "scripts" .}}{{end}}

</html>
