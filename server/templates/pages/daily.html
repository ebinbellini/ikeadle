{{define "content"}}
<main class="game-page" id="game"
      data-mode="daily" data-date="{{.Date}}" data-max-guesses="{{.MaxGuesses}}">
    <header class="game-header">
        <h1>Dagens vara</h1>
        <p>
            En vara ur IKEA-sortimentet. Gissa priset! Du har
            <strong>{{.MaxGuesses}}</strong> försök och inom
            <strong>{{.Tolerance}}</strong> räknas som rätt.
        </p>
    </header>

    <p class="game-status" id="game-status"{{if .Product.HasProduct}} hidden{{end}}>Laddar dagens vara…</p>

    {{template "product-card" .Product}}

    {{template "guess-board" .Product}}
</main>
{{- end}}

{{define "scripts"}}
<script src="/game.js" defer></script>
<script src="/daily.js" defer></script>
{{- end}}
