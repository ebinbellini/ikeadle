{{define "content"}}
<main class="game-page" id="game"
      data-mode="slump" data-product-id="{{.ProductID}}" data-max-guesses="{{.MaxGuesses}}">
    <header class="game-header">
        <h1>Jag har tur</h1>
        <p>
            En slumpad vara ur IKEA-sortimentet. Du har
            <strong>{{.MaxGuesses}}</strong> försök och inom
            <strong>{{.Tolerance}}</strong> räknas som rätt.
        </p>
    </header>

    <p class="game-status" id="game-status"{{if .Product.HasProduct}} hidden{{end}}>Drar en slumpad vara…</p>

    {{template "product-card" .Product}}

    {{template "guess-board" .Product}}
</main>
{{- end}}

{{define "scripts"}}
<script src="/game.js" defer></script>
<script src="/slump.js" defer></script>
{{- end}}
