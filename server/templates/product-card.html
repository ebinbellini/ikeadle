{{define "product-card"}}
<article class="product-card" id="product-card"{{if not .HasProduct}} hidden{{end}}>
    <div class="product-image">
        <img id="product-image" src="{{.ImageURL}}"
             alt="{{if .HasProduct}}{{.Name}}{{else}}Varan{{end}}">
    </div>
    <div class="product-details">
        <span class="product-category" id="product-category"
              {{- if or (not .HasProduct) (not .Category)}} hidden{{end}}>{{.Category}}</span>
        <h2 class="product-name" id="product-name">{{.Name}}</h2>
        <span class="product-description" id="product-description"
              {{- if or (not .HasProduct) (not .Description)}} hidden{{end}}>{{.Description}}</span>
        <span class="product-amount" id="product-amount"
              {{- if or (not .HasProduct) (not .Amount)}} hidden{{end}}>{{.Amount}}</span>
    </div>
    <div class="product-tag" aria-hidden="true">
        <span>?</span>
        <small>kr</small>
    </div>
</article>
{{- end}}
