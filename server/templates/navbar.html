{{define "navbar"}}
<navbar>
    <div class="icon-button" id="hamburger-button" onclick="open_mode_picker()"
         role="button" tabindex="0" aria-label="Öppna menyn">
        <img src="/icons/hamburger.svg" alt="" width="30" height="30">
    </div>
    <a href="/" id="logo" aria-label="IKEAdle - till startsidan">
        <img src="/icons/full-logo.svg" alt="" width="100" height="40">
    </a>
    <div id="mode-picker">
        <div class="mode-picker-title">Välj läge</div>
        <div id="close-button" class="icon-button" onclick="close_mode_picker()"
             role="button" tabindex="0" aria-label="Stäng menyn">
            <img src="/icons/close.svg" alt="" width="30" height="30">
        </div>
        {{- range .Modes}}
        <a href="{{.Href}}"{{if eq .Href $.ActiveLink}} aria-current="page"{{end}}>
            <div class="cool-button{{if eq .Href $.ActiveLink}} active{{end}}">
                <img src="{{.Icon}}" alt="" width="30" height="30">
                <span class="mode-label">{{.Label}}</span>
                <svg class="mode-arrow" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="m20.0008 12.0001-8-8.001-1.4143 1.414L16.1727 11H4v2h12.1723l-5.5868 5.5866 1.4141 1.4142 8.0012-8.0007z"></path>
                </svg>
            </div>
        </a>
        {{- end}}
    </div>
    <div id="external-links">
        <a href="https://youtu.be/7pO39Sh6THg" target="_blank" rel="noopener" class="icon-button" aria-label="Support">
            <img src="/icons/truck.svg" alt="" width="30" height="30">
        </a>
        <a href="https://ebinbellini.com/" target="_blank" rel="noopener" class="icon-button" aria-label="Ebin Bellini">
            <img src="/icons/web.svg" alt="" width="30" height="30">
        </a>
    </div>
</navbar>
{{end}}
